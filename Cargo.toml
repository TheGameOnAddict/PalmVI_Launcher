[package]
name = "mandyhub"
version = "0.3.3"
edition = "2021"
description = "PalmVI desktop launcher for VIctory builds, ZIP imports and Rust workspaces."
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json"] }
url = "2"
rfd = "0.14"
ring = "0.17"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Time", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
object = { version = "0.41", default-features = false, features = ["read_core", "pe"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = 3
strip = true

[build-dependencies]
find-msvc-tools = "0.1"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security", "Win32_Storage_FileSystem"] }
