[package]
name = "mandyhub"
version = "0.2.5"
edition = "2021"
description = "Mandyhub: a community launcher for VIctory-based projects: pick a repo from PortWatch or a custom link, check the game files, build and play."
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.10", features = ["json"] }
url = "2"
rfd = "0.14"
ring = "0.17"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Time", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[profile.release]
opt-level = 3
strip = true
